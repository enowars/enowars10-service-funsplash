services:
  funsplash:
    build:
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1337:1337"
    env_file:
      - .env
    networks:
      - funsplash
    restart: unless-stopped
    command: ["sh", "-c", "cd /app/server && gleam run"]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - funsplash
    volumes:
      - postgres_data:/var/lib/postgresql:z
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PGUSER} -d $${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  funsplash:
    driver: bridge
      
volumes:
  postgres_data:
