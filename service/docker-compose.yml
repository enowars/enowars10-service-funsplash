services:
  # n0t3b00k:
  #   build: .
  #   # The code should be copied into the container using COPY.
  #   # Mount the data folder writable, so that information can be persisted across restarts.
  #   volumes:
  #     - ./data/:/data:rwz
  #   # Define the port mapping (external:internal port)
  #   ports:
  #     - "2323:8000"
  #   restart: unless-stopped
  #   mem_limit: 1g
  #   cpus: 1

  funsplash:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1337:1337"
    env_file:
      - .env
    networks:
      - funsplash
    restart: unless-stopped
    # mem_limit: 1g
    # cpus: 1
    # volumes:
    #   - "build:/code:ro,z"
    # data etc

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - funsplash
    ports:
      - "${PGPORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql:z
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PGUSER} -d $${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  funsplash:
    driver: bridge
      
volumes:
  postgres_data:
